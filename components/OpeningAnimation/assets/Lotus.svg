<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 简化的莲花 - 占位符，支持分层动画 -->
  <defs>
    <radialGradient id="lotusGradient">
      <stop offset="0%" style="stop-color:#FFC0CB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- 外层花瓣 -->
  <g id="outer-petals">
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(45 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(90 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(135 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(180 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(225 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(270 100 100)"/>
    <ellipse cx="100" cy="60" rx="25" ry="45" fill="url(#lotusGradient)" transform="rotate(315 100 100)"/>
  </g>
  
  <!-- 中层花瓣 -->
  <g id="middle-petals">
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(22.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(67.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(112.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(157.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(202.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(247.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(292.5 100 100)"/>
    <ellipse cx="100" cy="70" rx="20" ry="35" fill="#FFB6C1" transform="rotate(337.5 100 100)"/>
  </g>
  
  <!-- 花心 -->
  <circle cx="100" cy="100" r="20" fill="#FFD700"/>
  <circle cx="100" cy="100" r="15" fill="#FFA500"/>
</svg>
