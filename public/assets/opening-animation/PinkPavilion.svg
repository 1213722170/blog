<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 简化的粉色楼房 - 占位符 -->
  <defs>
    <linearGradient id="pavilionGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00CED1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008B8B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 第三层屋顶 -->
  <path d="M 50 150 L 200 100 L 350 150 L 320 160 L 200 120 L 80 160 Z" fill="url(#roofGradient)"/>
  <rect x="150" y="150" width="100" height="80" fill="url(#pavilionGradient)" rx="5"/>
  
  <!-- 第二层屋顶 -->
  <path d="M 30 280 L 200 220 L 370 280 L 340 290 L 200 240 L 60 290 Z" fill="url(#roofGradient)"/>
  <rect x="120" y="280" width="160" height="100" fill="url(#pavilionGradient)" rx="5"/>
  
  <!-- 第一层屋顶 -->
  <path d="M 10 420 L 200 350 L 390 420 L 360 430 L 200 370 L 40 430 Z" fill="url(#roofGradient)"/>
  <rect x="80" y="420" width="240" height="80" fill="url(#pavilionGradient)" rx="5"/>
  
  <!-- 装饰细节 -->
  <circle cx="200" cy="190" r="8" fill="#00CED1"/>
  <circle cx="200" cy="330" r="10" fill="#00CED1"/>
  <circle cx="200" cy="460" r="12" fill="#00CED1"/>
</svg>
