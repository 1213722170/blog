<svg width="300" height="400" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 简化的松树 - 占位符 -->
  <defs>
    <linearGradient id="pineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2F4F4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2f2f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 树干 -->
  <rect x="135" y="250" width="30" height="150" fill="#4a3728" rx="5"/>
  
  <!-- 树冠 - 三层 -->
  <ellipse cx="150" cy="240" rx="80" ry="60" fill="url(#pineGradient)" opacity="0.9"/>
  <ellipse cx="150" cy="180" rx="70" ry="55" fill="url(#pineGradient)" opacity="0.95"/>
  <ellipse cx="150" cy="130" rx="60" ry="50" fill="url(#pineGradient)"/>
</svg>
